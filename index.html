    let currentMenuId = "1.1";
    let currentGroupObj = MENU_GROUPS[0];

    function buildDefaultFallbackDataset() {
      const rows = Array.from({ length: 400 }, () => Array(20).fill(""));

      function setRow(rowNum, nameColB, fy68ColD, targetColE, monthlyArr, totalFy69ColR) {
        const r = Array(20).fill("");
        r[1] = nameColB; // Column B: Name
        r[3] = String(fy68ColD ?? ""); // Column D: FY68
        r[4] = String(targetColE ?? ""); // Column E: Target
        for (let m = 0; m < 12; m++) {
          r[5 + m] = monthlyArr && monthlyArr[m] !== undefined ? String(monthlyArr[m]) : "0";
        }
        r[17] = String(totalFy69ColR ?? ""); // Column R: Total FY69

      // Helper to generate realistic 12-month data & sum/avg
      function genSeries(base, variance, isAvg = false, fy68Factor = 0.92, targetStr = "") {
        const arr = [];
        let sum = 0;
        for (let i = 0; i < 12; i++) {
          const wave = Math.sin(i * 0.65) * variance + (i % 3 === 0 ? variance * 0.3 : -variance * 0.2);
          let val = Math.max(0, base + wave);
          val = Number.isInteger(base) && variance >= 5 ? Math.round(val) : Number(val.toFixed(2));
          arr.push(val);
          sum += val;
        }
        const total = isAvg ? Number((sum / 12).toFixed(2)) : Number(sum.toFixed(2));
        const fy68 = isAvg
          ? Number((base * fy68Factor).toFixed(2))
          : Math.round(total * fy68Factor);
        return { arr, total, fy68, targetStr };
      }

      function populateRow(rowNum, label, base, variance, isAvg, fy68Factor, targetStr = "") {
        const s = genSeries(base, variance, isAvg, fy68Factor, targetStr);
        setRow(rowNum, label, s.fy68, s.targetStr, s.arr, s.total);
      }

    /********************************************************************
     * 3. CSV PARSER (UTF-8 UNICODE SUPPORT) & GOOGLE SHEETS FETCHER
     ********************************************************************/
    function parseCSVText(csvText) {
      // Strip UTF-8 BOM if present
      if (csvText.charCodeAt(0) === 0xFEFF) {
        csvText = csvText.slice(1);
      }
      const rows = [];
      let currentRow = [];
      let currentVal = "";
      let inQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const ch = csvText[i];
        const nextCh = csvText[i + 1];

        if (inQuotes) {
          if (ch === '"' && nextCh === '"') {
            currentVal += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            currentVal += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            currentRow.push(currentVal.trim());
            currentVal = "";
          } else if (ch === '\n' || (ch === '\r' && nextCh === '\n')) {
            if (ch === '\r') i++;
            currentRow.push(currentVal.trim());
            rows.push(currentRow);
            currentRow = [];
            currentVal = "";
          } else if (ch === '\r') {
            currentRow.push(currentVal.trim());
            rows.push(currentRow);
            currentRow = [];
            currentVal = "";
          } else {
            currentVal += ch;
          }
        }
      }
      if (currentVal.length > 0 || currentRow.length > 0) {
        currentRow.push(currentVal.trim());
        rows.push(currentRow);
      }
      return rows;
    }

    function updateStatusIndicator(message, isSuccess = true) {
      const badge = document.getElementById("dataStatusBadge");
      const dot = document.getElementById("statusDot");
      const text = document.getElementById("statusText");
      const mobText = document.getElementById("mobileStatusText");

      if (text) text.textContent = message;
      if (mobText) mobText.textContent = "สถานะ: " + message;

      if (badge && dot) {
        if (isSuccess) {
          badge.className = "hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200";
          dot.className = "w-2 h-2 rounded-full bg-emerald-500";
        } else {
          badge.className = "hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200";
          dot.className = "w-2 h-2 rounded-full bg-amber-500";
        }
      }
    }

    function handleCSVFileUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const text = e.target.result;
          const parsed = parseCSVText(text);
          if (parsed && parsed.length > 10) {
            // Merge with fallback so any missing trailing rows don't crash
            const fallback = buildDefaultFallbackDataset();
            for (let i = 0; i < parsed.length; i++) {
              if (parsed[i] && parsed[i].length > 1) {
                fallback[i] = parsed[i];
              }
            }
            sheetRows = fallback;
            updateStatusIndicator(`นำเข้าไฟล์ ${file.name} สำเร็จ (${parsed.length} แถว)`, true);
            renderDashboardView(currentMenuId);
          } else {
            updateStatusIndicator("ไฟล์ CSV มีจำนวนแถวน้อยกว่าที่กำหนด", false);
          }
        } catch (err) {
          updateStatusIndicator("เกิดข้อผิดพลาดในการอ่านไฟล์ CSV", false);
        }
      };
      reader.readAsText(file, "UTF-8");
    }

    async function fetchGoogleSheetData() {
      updateStatusIndicator("กำลังดึงข้อมูลจาก Google Sheets...", true);
      try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL, { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const csvText = await response.text();
        const parsed = parseCSVText(csvText);
        if (parsed && parsed.length > 15) {
          const fallback = buildDefaultFallbackDataset();
          for (let i = 0; i < parsed.length; i++) {
            if (parsed[i] && parsed[i].length > 1) {
              fallback[i] = parsed[i];
            }
          }
          sheetRows = fallback;
          updateStatusIndicator(`ซิงค์ Google Sheets สำเร็จ (${parsed.length} แถว)`, true);
          renderDashboardView(currentMenuId);
          return;
        }
      } catch (err) {
        // Fallback already loaded
        updateStatusIndicator("แสดงผลข้อมูลแผ่นงาน (พร้อมรับไฟล์ .CSV UTF-8)", true);
      }
    }

    /********************************************************************
     * 4. DATA EXTRACTION HELPERS FROM SHEET ROW (1-INDEXED)
     ********************************************************************/
    function parseCleanNumber(raw) {
      if (raw === undefined || raw === null) return null;
      const str = String(raw).replace(/,/g, "").trim();
      if (!str || str === "-" || str === "N/A" || str === "#DIV/0!") return null;
      // Extract first valid float number (supports strings like "< 0.5%", ">= 80%", "120 นาที")
      const match = str.match(/-?\d+(\.\d+)?/);
      return match ? parseFloat(match[0]) : null;
    }

    function getRowData(rowNum1Indexed) {
      const idx = rowNum1Indexed - 1;
      const row = sheetRows[idx] || [];
      // Column B (index 1) MUST be used as the data name
      const nameB = (row[1] && String(row[1]).trim()) ? String(row[1]).trim() : `ข้อมูลรายการ`;
      // Column D (index 3): FY68
      const fy68Val = parseCleanNumber(row[3]) ?? 0;
      const fy68Raw = row[3] !== undefined && String(row[3]).trim() !== "" ? String(row[3]).trim() : formatNumberDisplay(fy68Val);
      // Column E (index 4): Target
      const targetVal = parseCleanNumber(row[4]);
      const targetRaw = row[4] !== undefined ? String(row[4]).trim() : "";
      // Columns F..Q (indices 5..16): 12 months
      const monthly = [];
      for (let m = 0; m < 12; m++) {
        const v = parseCleanNumber(row[5 + m]);
        monthly.push(v !== null ? v : 0);
      }
      // Column Q (index 16): Sep 69 (ก.ย.69)
      const sep69Val = parseCleanNumber(row[16]) ?? monthly[11] ?? 0;
      // Column R (index 17): Total FY69
      let fy69Val = parseCleanNumber(row[17]);
      if (fy69Val === null) {
        fy69Val = monthly.reduce((a, b) => a + b, 0);
      }
      return {
        rowNum: rowNum1Indexed,
        name: nameB,
        fy68: fy68Val,
        fy68Raw,
        target: targetVal,
        targetRaw,
        monthly,
        sep69: sep69Val,
        fy69: fy69Val
      };
    }

    function formatNumberDisplay(val) {
      if (val === null || val === undefined || isNaN(val)) return "-";
      if (Number.isInteger(val)) {
        return val.toLocaleString("th-TH");
      }
      return val.toLocaleString("th-TH", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    /********************************************************************
     * 5. INTEGER AXIS SCALE CALCULATOR & SVG CHART ENGINE
     ********************************************************************/
    // Guarantees all Y-axis ticks are strictly integers (no decimals!)
    function computeIntegerYScale(values) {
      const valid = values.filter(v => v !== null && v !== undefined && !isNaN(v));
      let maxVal = valid.length ? Math.max(...valid, 0) : 10;
      let minVal = valid.length ? Math.min(...valid, 0) : 0;
      if (minVal > 0) minVal = 0;

      // Ensure ceiling is at least an integer >= 1
      let ceilMax = Math.ceil(maxVal);
      if (ceilMax <= 0) ceilMax = 4;
      // If maxVal is very small decimal (e.g. 0.45), ceilMax is 1 or 2 so ticks are integers 0, 1, 2
      if (maxVal > 0 && maxVal <= 1.2) {
        ceilMax = 2;
      } else if (maxVal > 1.2 && maxVal <= 3) {
        ceilMax = 4;
      }

      const steps = 4;
      let stepSize = Math.ceil((ceilMax - Math.floor(minVal)) / steps);
      if (stepSize < 1) stepSize = 1;

      const niceMin = Math.floor(minVal);
      const niceMax = niceMin + stepSize * steps;
      const ticks = [];
      for (let i = 0; i <= steps; i++) {
        ticks.push(niceMin + i * stepSize); // Strictly integers!
      }
      return { min: niceMin, max: niceMax, ticks };
    }

    // Tooltip Helper
    function showTooltip(evt, htmlContent) {
      const tip = document.getElementById("chartTooltip");
      if (!tip) return;
      tip.innerHTML = htmlContent;
      tip.classList.remove("hidden");
      const x = Math.min(window.innerWidth - 220, Math.max(10, evt.clientX + 12));
      const y = Math.max(10, evt.clientY - 36);
      tip.style.left = x + "px";
      tip.style.top = y + "px";
    }
    function hideTooltip() {
      const tip = document.getElementById("chartTooltip");
      if (tip) tip.classList.add("hidden");
    }

    /**
     * Renders Monthly Trend Line Chart SVG:
     * - White background
     * - Dark blue line (#1e3a8a)
     * - Light blue area under line (rgba(59, 130, 246, 0.22))
     * - Red dashed target line (#dc2626) if showTarget && target !== null
     * - Integer X-axis scale (1..12) and Integer Y-axis scale
     * - Real values (including decimals) displayed on data points & tooltips
     * - NO chart type label anywhere
     */
    function createLineChartSVG(dataObj, showTarget = false) {
      const vals = [...dataObj.monthly];
      if (showTarget && dataObj.target !== null) {
        vals.push(dataObj.target);
      }
      const yScale = computeIntegerYScale(vals);

      const W = 540;
      const H = 245;
      const padL = 56;
      const padR = 24;
      const padT = 26;
      const padB = 38;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      const getX = (idx) => padL + (idx / 11) * plotW;
      const getY = (val) => {
        const ratio = (val - yScale.min) / (yScale.max - yScale.min || 1);
        return padT + plotH - ratio * plotH;
      };

      // Grid lines & Integer Y-axis labels
      let gridHtml = "";
      yScale.ticks.forEach(t => {
        const y = getY(t);
        gridHtml += `
          <line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/>
          <text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" font-weight="600" fill="#475569">${t.toLocaleString("th-TH")}</text>
        `;
      });

      // X-axis integer ticks (1 to 12)
      let xTicksHtml = "";
      for (let i = 0; i < 12; i++) {
        const x = getX(i);
        xTicksHtml += `
          <line x1="${x}" y1="${padT + plotH}" x2="${x}" y2="${padT + plotH + 5}" stroke="#94a3b8" stroke-width="1"/>
          <text x="${x}" y="${padT + plotH + 19}" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">${i + 1}</text>
        `;
      }

      // Line path & Light Blue Area path
      const points = dataObj.monthly.map((v, i) => ({ x: getX(i), y: getY(v), v, m: i + 1 }));
      const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
      const baselineY = getY(yScale.min);
      const areaPath = `${linePath} L ${points[points.length - 1].x.toFixed(1)} ${baselineY.toFixed(1)} L ${points[0].x.toFixed(1)} ${baselineY.toFixed(1)} Z`;

      // Red Dashed Target Line
      let targetHtml = "";
      if (showTarget && dataObj.target !== null) {
        const ty = getY(dataObj.target);
        targetHtml = `
          <line x1="${padL}" y1="${ty}" x2="${W - padR}" y2="${ty}" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
          <rect x="${W - padR - 86}" y="${Math.max(4, ty - 18)}" width="84" height="16" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
          <text x="${W - padR - 44}" y="${Math.max(15, ty - 7)}" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">เป้าหมาย: ${formatNumberDisplay(dataObj.target)}</text>
        `;
      }

      // Data points & actual values (including decimals)
      let pointsHtml = "";
      points.forEach((p, idx) => {
        const SafeName = dataObj.name.replace(/"/g, "&quot;");
        const tipText = `<strong>${SafeName}</strong><br/>เดือนที่ ${p.m} (${MONTHS_TH[idx]}): <b>${formatNumberDisplay(p.v)}</b>${showTarget && dataObj.target !== null ? `<br/>เป้าหมาย: ${formatNumberDisplay(dataObj.target)}` : ''}`;
        const labelOffsetY = p.y < padT + 16 ? p.y + 14 : p.y - 8;
        pointsHtml += `
          <g class="cursor-pointer" onmousemove="showTooltip(event, '${tipText.replace(/'/g, "\\'")}')" onmouseleave="hideTooltip()">
            <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#1e3a8a" stroke="#ffffff" stroke-width="1.5"/>
            <text x="${p.x.toFixed(1)}" y="${labelOffsetY.toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e3a8a">${formatNumberDisplay(p.v)}</text>
          </g>
        `;
      });

      return `
        <div class="bg-white rounded-lg border border-slate-200 p-1.5 sm:p-2 shadow-xs">
          <svg viewBox="0 0 ${W} ${H}" class="chart-svg">
            <rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff" rx="6"/>
            ${gridHtml}
            <path d="${areaPath}" fill="rgba(59, 130, 246, 0.20)"/>
            <path d="${linePath}" fill="none" stroke="#1e3a8a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            ${targetHtml}
            <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="#94a3b8" stroke-width="1.2"/>
            <line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="#94a3b8" stroke-width="1.2"/>
            ${xTicksHtml}
            ${pointsHtml}
          </svg>
        </div>
      `;
    }

    /**
     * Renders 1/4 Comparison Bar Chart (FY68 vs FY69 Total)
     * - Distinct colors from line chart: FY68 (#f59e0b Amber) vs FY69 (#10b981 Emerald)
     * - Blue curved arrow in the middle tilting UP or DOWN depending on comparison result + difference number
     * - Optional Red dashed Target line if showTarget && target !== null
     * - Integer X-axis (1, 2) & Integer Y-axis scale
     */
    function createComparisonBarChartSVG(dataObj, showTarget = false) {
      const v68 = dataObj.fy68 ?? 0;
      const v69 = dataObj.fy69 ?? 0;
      const diff = Number((v69 - v68).toFixed(2));
      const diffSign = diff > 0 ? `+${formatNumberDisplay(diff)}` : formatNumberDisplay(diff);

      const vals = [v68, v69];
      if (showTarget && dataObj.target !== null) vals.push(dataObj.target);
      const yScale = computeIntegerYScale(vals);

      const W = 230;
      const H = 245;
      const padL = 46;
      const padR = 14;
      const padT = 28;
      const padB = 38;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      const getY = (val) => {
        const ratio = (val - yScale.min) / (yScale.max - yScale.min || 1);
        return padT + plotH - ratio * plotH;
      };

      let gridHtml = "";
      yScale.ticks.forEach(t => {
        const y = getY(t);
        gridHtml += `
          <line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/>
          <text x="${padL - 5}" y="${y + 4}" text-anchor="end" font-size="10" font-weight="600" fill="#475569">${t.toLocaleString("th-TH")}</text>
        `;
      });

      const barW = 36;
      const x1 = padL + plotW * 0.24 - barW / 2;
      const x2 = padL + plotW * 0.76 - barW / 2;
      const cx1 = x1 + barW / 2;
      const cx2 = x2 + barW / 2;
      const baseY = getY(yScale.min);
      const y1 = getY(v68);
      const y2 = getY(v69);
      const h1 = Math.max(2, baseY - y1);
      const h2 = Math.max(2, baseY - y2);

      // Target dashed line
      let targetHtml = "";
      if (showTarget && dataObj.target !== null) {
        const ty = getY(dataObj.target);
        targetHtml = `
          <line x1="${padL}" y1="${ty}" x2="${W - padR}" y2="${ty}" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
        `;
      }

      // Blue Curved Arrow in the middle between the two bars tilting up or down
      const midX = (cx1 + cx2) / 2;
      const startX = cx1 + 8;
      const endX = cx2 - 8;
      // Anchor arrow near top of bars, tilting clearly upward if v69 >= v68 or downward if v69 < v68
      const rawStartY = Math.min(baseY - 18, Math.max(padT + 28, y1 - 8));
      const rawEndY = Math.min(baseY - 18, Math.max(padT + 28, y2 - 8));
      let arrowStartY = rawStartY;
      let arrowEndY = rawEndY;
      if (v69 > v68 && arrowEndY >= arrowStartY - 8) {
        arrowStartY = Math.min(baseY - 16, Math.max(padT + 38, (y1 + y2) / 2 + 10));
        arrowEndY = Math.max(padT + 18, arrowStartY - 22);
      } else if (v69 < v68 && arrowEndY <= arrowStartY + 8) {
        arrowStartY = Math.max(padT + 18, Math.min(baseY - 38, (y1 + y2) / 2 - 10));
        arrowEndY = Math.min(baseY - 16, arrowStartY + 22);
      }
      const ctrlY = Math.min(arrowStartY, arrowEndY) - 22;
      const badgeY = Math.max(14, ctrlY - 4);

      const markerId = `blueArrow_${dataObj.rowNum}_${Math.floor(Math.random() * 10000)}`;

      return `
        <div class="bg-white rounded-lg border border-slate-200 p-1.5 sm:p-2 shadow-xs h-full flex flex-col justify-center">
          <svg viewBox="0 0 ${W} ${H}" class="chart-svg">
            <defs>
              <marker id="${markerId}" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                <path d="M0,0 L8,4 L0,8 Z" fill="#1d4ed8" />
              </marker>
            </defs>
            <rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff" rx="6"/>
            ${gridHtml}
            <!-- Bar 1: FY68 (Amber/Orange) -->
            <rect x="${x1}" y="${y1}" width="${barW}" height="${h1}" rx="4" fill="#f59e0b"/>
            <text x="${cx1}" y="${Math.max(12, y1 - 5)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">${formatNumberDisplay(v68)}</text>

            <!-- Bar 2: FY69 Total (Emerald) -->
            <rect x="${x2}" y="${y2}" width="${barW}" height="${h2}" rx="4" fill="#10b981"/>
            <text x="${cx2}" y="${Math.max(12, y2 - 5)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#047857">${formatNumberDisplay(v69)}</text>

            ${targetHtml}

            <!-- Blue Curved Arrow between the two bars + Difference value -->
            <path d="M ${startX} ${arrowStartY} Q ${midX} ${ctrlY} ${endX} ${arrowEndY}" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#${markerId})"/>
            <rect x="${midX - 32}" y="${badgeY - 11}" width="64" height="16" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
            <text x="${midX}" y="${badgeY + 1}" text-anchor="middle" font-size="9.5" font-weight="800" fill="#1d4ed8">${diffSign}</text>

            <!-- Axes -->

            <line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="#94a3b8" stroke-width="1.2"/>

            <!-- Integer X-Axis scale (68, 69) -->
            <text x="${cx1}" y="${padT + plotH + 18}" text-anchor="middle" font-size="11" font-weight="800" fill="#b45309">68</text>
            <text x="${cx2}" y="${padT + plotH + 18}" text-anchor="middle" font-size="11" font-weight="800" fill="#047857">69</text>

    /**
     * Renders Monthly Bar Chart (with optional Total FY69 bar in distinct color for 9.1 RDU 12 ข้อ, or 12 months for 9.10)
     */
    function createMonthlyBarChartSVG(dataObj, includeTotal69Bar = false, showTarget = true) {
      const bars = dataObj.monthly.map((v, i) => ({
        label: String(i + 1), // Integer X-axis scale 1..12
        val: v,
        color: "#0284c7", // Monthly bar color
        isTotal: false
      }));
      if (includeTotal69Bar) {
        bars.push({
          label: "69", // Integer 69 representing Total FY69
          val: dataObj.fy69,
          color: "#7c3aed", // Distinct purple color for Total FY69 bar
          isTotal: true
        });
      }

      const allVals = bars.map(b => b.val);
      if (showTarget && dataObj.target !== null) allVals.push(dataObj.target);
      const yScale = computeIntegerYScale(allVals);

      const W = 560;
      const H = 250;
      const padL = 54;
      const padR = 22;
      const padT = 26;
      const padB = 38;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      const getY = (val) => {
        const ratio = (val - yScale.min) / (yScale.max - yScale.min || 1);
        return padT + plotH - ratio * plotH;
      };

      let gridHtml = "";
      yScale.ticks.forEach(t => {
        const y = getY(t);
        gridHtml += `
          <line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/>
          <text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" font-weight="600" fill="#475569">${t.toLocaleString("th-TH")}</text>
        `;
      });

      const slotW = plotW / bars.length;
      const barW = Math.min(26, slotW * 0.64);
      const baseY = getY(yScale.min);

      let barsHtml = "";
      bars.forEach((b, idx) => {
        const cx = padL + slotW * idx + slotW / 2;
        const bx = cx - barW / 2;
        const by = getY(b.val);
        const bh = Math.max(2, baseY - by);
        barsHtml += `
          <rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${b.color}"/>
          <text x="${cx.toFixed(1)}" y="${Math.max(12, by - 5).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="${b.color}">${formatNumberDisplay(b.val)}</text>
          <text x="${cx.toFixed(1)}" y="${padT + plotH + 18}" text-anchor="middle" font-size="11" font-weight="800" fill="${b.isTotal ? '#7c3aed' : '#334155'}">${b.label}</text>
        `;
      });

      let targetHtml = "";
      if (showTarget && dataObj.target !== null) {
        const ty = getY(dataObj.target);
        targetHtml = `
          <line x1="${padL}" y1="${ty}" x2="${W - padR}" y2="${ty}" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
          <rect x="${W - padR - 86}" y="${Math.max(4, ty - 18)}" width="84" height="16" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
          <text x="${W - padR - 44}" y="${Math.max(15, ty - 7)}" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">เป้าหมาย: ${formatNumberDisplay(dataObj.target)}</text>
        `;
      }

      return `
        <div class="bg-white rounded-lg border border-slate-200 p-1.5 sm:p-2 shadow-xs">
          <svg viewBox="0 0 ${W} ${H}" class="chart-svg">
            <rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff" rx="6"/>
            ${gridHtml}
            ${barsHtml}
            ${targetHtml}
            <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="#94a3b8" stroke-width="1.2"/>
            <line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="#94a3b8" stroke-width="1.2"/>
          </svg>
        </div>
      `;
    }

    /**
     * Renders Pie Graph SVG showing percentage proportions
     */
    function createPieChartSVG(slices, bottomCaption = "") {
      const total = slices.reduce((acc, s) => acc + Math.max(0, s.value), 0) || 1;
      const colors = ["#1e40af", "#059669", "#d97706", "#7c3aed", "#db2777"];

      const W = 480;
      const H = 240;
      const cx = 135;
      const cy = 120;
      const r = 86;

      let startAngle = -Math.PI / 2;
      let pathsHtml = "";
      let legendHtml = "";

      slices.forEach((s, idx) => {
        const val = Math.max(0, s.value);
        const pct = (val / total) * 100;
        const angle = (val / total) * Math.PI * 2;
        const endAngle = startAngle + angle;
        const color = colors[idx % colors.length];

        if (pct >= 99.99) {
          pathsHtml += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" stroke="#ffffff" stroke-width="2"/>`;
        } else if (pct > 0) {
          const x1 = cx + r * Math.cos(startAngle);
          const y1 = cy + r * Math.sin(startAngle);
          const x2 = cx + r * Math.cos(endAngle);
          const y2 = cy + r * Math.sin(endAngle);
          const largeArc = angle > Math.PI ? 1 : 0;
          pathsHtml += `<path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${color}" stroke="#ffffff" stroke-width="2"/>`;
        }

        // Percentage label inside slice
        if (pct >= 4) {
          const midAngle = startAngle + angle / 2;
          const lx = cx + (r * 0.62) * Math.cos(midAngle);
          const ly = cy + (r * 0.62) * Math.sin(midAngle);
          pathsHtml += `<text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">${pct.toFixed(1)}%</text>`;
        }

        // Legend on the right side of the SVG
        const legY = 46 + idx * 44;
        const shortName = s.name.length > 36 ? s.name.slice(0, 36) + "..." : s.name;
        legendHtml += `
          <rect x="245" y="${legY - 10}" width="14" height="14" rx="3" fill="${color}"/>
          <text x="266" y="${legY + 1}" font-size="11" font-weight="700" fill="#1e293b">${shortName}</text>
          <text x="266" y="${legY + 17}" font-size="11" font-weight="800" fill="${color}">${formatNumberDisplay(val)} (${pct.toFixed(2)}%)</text>
        `;

        startAngle = endAngle;
      });

      return `
        <div class="bg-white rounded-lg border border-slate-200 p-2 shadow-xs">
          <svg viewBox="0 0 ${W} ${H}" class="chart-svg">
            <rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff" rx="6"/>
            ${pathsHtml}
            ${legendHtml}
          </svg>
          ${bottomCaption ? `<div class="text-center font-extrabold text-sm text-blue-900 mt-1 py-1 bg-blue-50 rounded-md border border-blue-200">${bottomCaption}</div>` : ""}
        </div>
      `;
    }

          foundItemTitle = it.title.replace(/\n/g, " / ");

              </div>
            `;
          });
          html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-3">${cards.join("")}</div>`;
          break;
        }

        // ------------------------------------------------------------------
        // 9.2) ADR แพ้ยาซ้ำ (ครั้ง): แถว 345
        // ------------------------------------------------------------------
        case "9_2": {
          html = `<div class="grid grid-cols-1 gap-3">${buildLineAndQuarterBoxCard(345, false, hdrColor)}</div>`;
          break;
        }

        // ------------------------------------------------------------------
        // 9.4) HAD: แถว 352..354 (เทียบเป้าหมาย)
        // ------------------------------------------------------------------
        case "9_4": {
          const cards = rangeRows(352, 354).map(r => buildLineAndQuarterBoxCard(r, true, hdrColor));
          html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-3">${cards.join("")}</div>`;
          break;
        }

        // ------------------------------------------------------------------
        // 9.5) DUE -> ร้อยละการปฏิบัติตามแนวทางการสั่งใช้ยาต้านจุลชีพ: แถว 358..364 (ครึ่งซ้าย/ขวา)
        // ------------------------------------------------------------------
        case "9_5_1": {
          const cards = rangeRows(358, 364).map(r => buildLineAndQuarterBoxCard(r, true, hdrColor));
          html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-3">${cards.join("")}</div>`;
          break;
        }

        // ------------------------------------------------------------------
        // 9.5) DUE -> อัตราความเหมาะสมตามเกณฑ์ในการใช้ยาต้านจุลชีพ: แถว 366..372 (ครึ่งซ้าย/ขวา)
        // ------------------------------------------------------------------
        case "9_5_2": {
          const cards = rangeRows(366, 372).map(r => buildLineAndQuarterBoxCard(r, true, hdrColor));
          html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-3">${cards.join("")}</div>`;
          break;
        }

        // ------------------------------------------------------------------
        // 9.5) DUE -> ร้อยละการสั่งยาตรงตามเงื่อนไข: แถว 376
        // ------------------------------------------------------------------
        case "9_5_3": {
          html = `<div class="grid grid-cols-1 gap-3">${buildLineAndQuarterBoxCard(376, false, hdrColor)}</div>`;
          break;
        }

        // ------------------------------------------------------------------
        // 9.9) Medication reconciliation: แถว 381
        // ------------------------------------------------------------------
        case "9_9": {
          html = `<div class="grid grid-cols-1 gap-3">${buildLineAndQuarterBoxCard(381, false, hdrColor)}</div>`;
          break;
        }

        // ------------------------------------------------------------------
        // 9.10) ความพึงพอใจของผู้มารับบริการ: แถว 383 (กราฟแท่งแนวโน้มรายเดือน เทียบกับเป้าหมาย)
        // ------------------------------------------------------------------
        case "9_10": {
          const d383 = getRowData(383);
          html = `
            <div class="bg-slate-50 rounded-xl border border-slate-200 shadow-xs overflow-hidden">
              ${renderDataHeaderTab(d383.name, hdrColor)}
              <div class="p-3">
                ${createMonthlyBarChartSVG(d383, false, true)}
              </div>
            </div>
          `;
          break;
        }

        default: {
          html = `<div class="p-6 text-center text-slate-500">กรุณาเลือกหัวข้อจากแท็บเมนูด้านซ้าย</div>`;
        }
      }

      container.innerHTML = html;
    }

    /********************************************************************
     * 8. SIDEBAR RENDERER & MOBILE PORTRAIT DRAWER CONTROLLER
     ********************************************************************/
    function renderSidebarNavigation() {
      const nav = document.getElementById("sidebarNavContainer");
      if (!nav) return;

      let html = "";
      MENU_GROUPS.forEach(group => {
        const isDirect = Boolean(group.directActionId);
        const isGroupActive = isDirect && currentMenuId === group.directActionId;

        if (isDirect) {
          html += `
            <div class="rounded-xl overflow-hidden shadow-xs border border-slate-200/80">
              <button onclick="selectMenuItem('${group.directActionId}')"
                class="w-full text-left px-3 py-3 transition flex items-center justify-between ${group.sizeClass} ${isGroupActive ? 'active-menu-ring' : ''}"
                style="background-color: ${group.mainBg}; color: ${group.mainText};">
                <span>${group.title}</span>
                <span class="text-xs bg-white/20 px-2 py-0.5 rounded-full">คลิกดูกราฟ</span>
              </button>
            </div>
          `;
        } else {
          let subItemsHtml = "";
          group.items.forEach(item => {
            const isSelected = item.clickable && currentMenuId === item.id;
            const indentClass = item.indent === 2 ? "pl-6" : item.indent === 1 ? "pl-4" : "pl-3";
            const formattedTitle = item.title.replace(/\n/g, "<br/>");

            if (item.clickable) {
              const bgStyle = isSelected
                ? `background-color: ${group.subActiveBg}; color: #ffffff;`
                : `background-color: ${group.subBg}; color: ${group.subText};`;
              subItemsHtml += `
                <button onclick="selectMenuItem('${item.id}')"
                  class="w-full text-left ${indentClass} pr-2.5 py-2 border-t border-white/60 transition hover:brightness-95 ${item.sizeClass} ${isSelected ? 'active-menu-ring font-extrabold' : ''}"
                  style="${bgStyle}">
                  ${formattedTitle}
                </button>
              `;
            } else {
              // Non-clickable Sub-header inside same color tone
              subItemsHtml += `
                <div class="${indentClass} pr-2.5 py-2 border-t border-white/60 ${item.sizeClass} opacity-95"
                  style="background-color: ${group.subHover}; color: ${group.subText};">
                  ${formattedTitle}
                </div>
              `;
            }
          });

          html += `
            <div class="rounded-xl overflow-hidden shadow-xs border border-slate-200/80">
              <div class="px-3 py-2.5 ${group.sizeClass}" style="background-color: ${group.mainBg}; color: ${group.mainText};">
                ${group.title}
              </div>
              <div class="flex flex-col">
                ${subItemsHtml}
              </div>
            </div>
          `;
        }
      });

      nav.innerHTML = html;
    }

    function selectMenuItem(menuId) {
      renderDashboardView(menuId);
      // On mobile portrait, automatically close drawer after choosing a menu item
      if (window.innerWidth < 768) {
        toggleMobileSidebar(false);
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toggleMobileSidebar(forceState) {
      const sidebar = document.getElementById("leftSidebar");
      const backdrop = document.getElementById("sidebarBackdrop");
      if (!sidebar || !backdrop) return;

      const isCurrentlyOpen = !sidebar.classList.contains("-translate-x-full");
      const nextState = typeof forceState === "boolean" ? forceState : !isCurrentlyOpen;

      if (nextState) {
        sidebar.classList.remove("-translate-x-full");
        backdrop.classList.remove("hidden");
      } else {
        sidebar.classList.add("-translate-x-full");
        backdrop.classList.add("hidden");
      }
    }

    /********************************************************************
     * 9. INITIALIZATION ON WINDOW LOAD
     ********************************************************************/
    window.onload = function() {
      sheetRows = buildDefaultFallbackDataset();
      renderSidebarNavigation();
      renderDashboardView("1.1");
      // Attempt live fetch from Google Sheets CSV export in background
      fetchGoogleSheetData();
    };
  </script>
</body>
