<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ระบบรายงานผลการดำเนินงานกลุ่มงานเภสัชกรรม</title>
  <!-- Google Fonts: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- PapaParse สำหรับอ่านไฟล์ CSV จาก Google Sheets -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --bg-main: #f4f7fb;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;

      /* สีประจำแต่ละกลุ่มงาน */
      --c-opd: #2563eb;       /* น้ำเงิน - ผู้ป่วยนอก */
      --c-opd-bg: #eff6ff;
      --c-ipd: #059669;       /* เขียว - ผู้ป่วยใน */
      --c-ipd-bg: #ecfdf5;
      --c-inv: #d97706;       /* ส้มทอง - บริหารเวชภัณฑ์ */
      --c-inv-bg: #fffbeb;
      --c-prod: #7c3aed;      /* ม่วง - เภสัชกรรมการผลิต */
      --c-prod-bg: #f5f3ff;
      --c-pcu: #0891b2;       /* ฟ้าคราม - เภสัชกรรมปฐมภูมิ */
      --c-pcu-bg: #ecfeff;
      --c-qa: #e11d48;        /* ชมพูเข้ม/แดง - ระบบงานคุณภาพ */
      --c-qa-bg: #fff1f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Prompt', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-dark);
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* แถบด้านบน */
    .top-bar {
      background: #0f172a;
      color: #ffffff;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      z-index: 20;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .toggle-sidebar-btn {
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .app-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .upload-btn {
      background: #10b981;
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      border: none;
    }

    #csvFileInput {
      display: none;
    }

    /* โครงสร้างหลัก แนวตั้ง (ซ้าย: แท็บเมนู, ขวา: เนื้อหา) */
    .main-layout {
      display: flex;
      flex: 1;
      width: 100%;
      height: calc(100dvh - 44px);
      overflow: hidden;
    }

    /* แถบเมนูด้านซ้าย (ออกแบบให้พอดีกับหน้าจอมือถือแนวตั้ง) */
    .left-tabs {
      width: 38%;
      max-width: 195px;
      min-width: 135px;
      background: #ffffff;
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
      padding: 6px 4px 24px 4px;
      flex-shrink: 0;
      transition: all 0.25s ease;
    }

    .left-tabs.collapsed {
      width: 0;
      min-width: 0;
      padding: 0;
      border-right: none;
      overflow: hidden;
    }

    /* สไตล์ปุ่มแท็บตามขนาดตัวอักษรที่กำหนด */
    .tab-group {
      margin-bottom: 10px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    /* ตัวหนังสือตัวใหญ่พิเศษ (Extra Large) สำหรับหัวข้อกลุ่มงานหลัก */
    .tab-xl {
      width: 100%;
      text-align: left;
      padding: 9px 7px;
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.25;
      border: none;
      cursor: pointer;
      display: block;
      word-break: break-word;
    }

    /* ตัวหนังสือตัวใหญ่ (Large) สำหรับหัวข้อหลักในกลุ่ม */
    .tab-lg {
      width: 100%;
      text-align: left;
      padding: 7px 7px 7px 9px;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.28;
      border: none;
      border-top: 1px solid rgba(0,0,0,0.06);
      background: #ffffff;
      color: var(--text-dark);
      cursor: pointer;
      display: block;
      word-break: break-word;
      transition: background 0.15s;
    }

    /* หัวข้อกลุ่มย่อยที่ไม่ได้กดเลือกแต่เป็นหมวดตัวใหญ่ */
    .tab-lg-header {
      width: 100%;
      text-align: left;
      padding: 7px 7px 4px 9px;
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.25;
      border-top: 1px solid rgba(0,0,0,0.06);
      background: rgba(248, 250, 252, 0.9);
      color: #334155;
      display: block;
    }

    /* ตัวหนังสือขนาดปกติสำหรับข้อย่อย */
    .tab-md {
      width: 100%;
      text-align: left;
      padding: 6px 6px 6px 14px;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.25;
      border: none;
      border-top: 1px dashed rgba(0,0,0,0.06);
      background: #ffffff;
      color: #475569;
      cursor: pointer;
      display: block;
      word-break: break-word;
    }

    /* สีประจำกลุ่มงาน */
    .group-opd .tab-xl { background: var(--c-opd); color: #fff; }
    .group-opd .tab-item.active { background: var(--c-opd-bg); color: var(--c-opd); border-left: 4px solid var(--c-opd); font-weight: 700; }

    .group-ipd .tab-xl { background: var(--c-ipd); color: #fff; }
    .group-ipd .tab-item.active { background: var(--c-ipd-bg); color: var(--c-ipd); border-left: 4px solid var(--c-ipd); font-weight: 700; }

    .group-inv .tab-xl { background: var(--c-inv); color: #fff; }
    .group-inv .tab-item.active { background: var(--c-inv-bg); color: var(--c-inv); border-left: 4px solid var(--c-inv); font-weight: 700; }

    .group-prod .tab-xl { background: var(--c-prod); color: #fff; }
    .group-prod .tab-xl.active { box-shadow: inset 0 0 0 3px #ddd6fe; }

    .group-pcu .tab-xl { background: var(--c-pcu); color: #fff; }
    .group-pcu .tab-item.active { background: var(--c-pcu-bg); color: var(--c-pcu); border-left: 4px solid var(--c-pcu); font-weight: 700; }

    .group-qa .tab-xl { background: var(--c-qa); color: #fff; }
    .group-qa .tab-item.active { background: var(--c-qa-bg); color: var(--c-qa); border-left: 4px solid var(--c-qa); font-weight: 700; }

    /* พื้นที่แสดงผลด้านขวา */
    .content-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px 8px 28px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-banner {
      padding: 10px 12px;
      border-radius: 10px;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .section-banner .group-label {
      font-size: 10.5px;
      opacity: 0.9;
      font-weight: 400;
    }

    .section-banner .item-title {
      font-size: 14px;
      font-weight: 700;
      margin-top: 2px;
      line-height: 1.3;
    }

    /* การ์ดแสดงผล */
    .card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      border: 1px solid var(--border-color);
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* กริดการ์ดสรุปตัวเลข (วางซ้อนแนวตั้งหรือ 2 คอลัมน์ขนาดกะทัดรัด) */
    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .kpi-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
       flex-direction: column;
      gap: 2px;
    }

    .kpi-name {
      font-size: 11.5px;
      color: #334155;
      font-weight: 500;
      line-height: 1.3;
    }

    .kpi-values {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 2px;
    }

    .kpi-actual {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }

    .kpi-target {
      font-size: 10.5px;
      padding: 2px 6px;
      border-radius: 99px;
      background: #e2e8f0;
      color: #475569;
      font-weight: 500;
    }

    .badge-pass {
      background: #dcfce7;
      color: #166534;
    }

    .badge-fail {
      background: #ffe4e6;
      color: #9f1239;
      font-weight: 600;
    }

    /* กล่องกราฟสำหรับหน้าจอแนวตั้ง */
    .chart-box {
      position: relative;
      width: 100%;
      height: 230px;
    }

    .chart-box-tall {
      position: relative;
      width: 100%;
      height: 290px;
    }

    /* แถบแจ้งเตือนรายการไม่ผ่านเกณฑ์ */
    .alert-box {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      border-left: 4px solid #e11d48;
      border-radius: 8px;
      padding: 9px 10px;
    }

    .alert-title {
      font-size: 12px;
      font-weight: 700;
      color: #9f1239;
      margin-bottom: 4px;
    }

    .alert-list {
      list-style: none;
      font-size: 11.5px;
      color: #881337;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* แถบความคืบหน้าสำหรับรายการคลินิกพิเศษ/รายการย่อย */
    .progress-row {
      padding: 6px 0;
      border-bottom: 1px dashed #e2e8f0;
    }
    .progress-row:last-child {
      border-bottom: none;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      margin-bottom: 4px;
      gap: 6px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 99px;
    }

    .status-note {
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- แถบด้านบน -->
  <header class="top-bar">
    <div class="top-bar-left">
      <button class="toggle-sidebar-btn" onclick="toggleSidebar()" title="ย่อ/ขยายเมนู">☰</button>
      <div class="app-title">Dashboard กลุ่มงานเภสัชกรรม</div>
    </div>
    <label class="upload-btn" for="csvFileInput">📂 โหลด CSV</label>
    <input type="file" id="csvFileInput" accept=".csv" />
  </header>

  <!-- โครงสร้างหลัก -->
  <div class="main-layout">
    <!-- แถบด้านซ้าย: เมนูกิจกรรมแยกสีและขนาดตัวอักษร -->
    <aside class="left-tabs" id="sidebar">

      <!-- 1. งานบริการเภสัชกรรมผู้ป่วยนอก -->
      <div class="tab-group group-opd">
        <div class="tab-xl">งานบริการเภสัชกรรมผู้ป่วยนอก</div>
        <button class="tab-lg tab-item active" onclick="selectTab('1.1', this)">1.1 ข้อมูลบริการทั่วไป</button>
        <button class="tab-lg tab-item" onclick="selectTab('1.2.1', this)">1.2.1 medication error</button>
        <button class="tab-lg tab-item" onclick="selectTab('1.2.6', this)">1.2.6 ระยะเวลาในการรอรับบริการผู้ป่วยนอก</button>
        <button class="tab-lg tab-item" onclick="selectTab('2.2', this)">2.2 การให้บริการคลีนิคพิเศษ</button>
      </div>

      <!-- 2. งานบริการเภสัชกรรมผู้ป่วยใน -->
      <div class="tab-group group-ipd">
        <div class="tab-xl">งานบริการเภสัชกรรมผู้ป่วยใน</div>
        <button class="tab-lg tab-item" onclick="selectTab('3.1', this)">3.1 ข้อมูลบริการผู้ป่วยใน</button>
        <div class="tab-lg-header">ข้อมูลความคลาดเคลื่อนทางยา</div>
        <button class="tab-md tab-item" onclick="selectTab('3.2.1', this)">3.2.1 medication error</button>
        <button class="tab-md tab-item" onclick="selectTab('3.2.4', this)">3.2.4 High alert drug</button>
        <button class="tab-lg tab-item" onclick="selectTab('3.2.7.1', this)">3.2.7.1 เวลาให้ยา stat ผู้ป่วยใน</button>
      </div>

      <!-- 3. งานบริหารเวชภัณฑ์ -->
      <div class="tab-group group-inv">
        <button class="tab-xl tab-item" onclick="selectTab('prod_246', this)" title="กดเพื่อดูข้อมูลรวมทั้งปี หรือเลือกหัวข้อย่อยด้านล่าง">งานบริหารเวชภัณฑ์</button>
        <button class="tab-lg tab-item" onclick="selectTab('5.1', this)">5.1 ข้อมูลพื้นฐาน</button>
        <div class="tab-lg-header">5.2 ข้อมูลการปฏิบัติงานและตัวชี้วัดสำคัญ</div>
        <button class="tab-md tab-item" onclick="selectTab('5.2.1', this)">5.2.1 การจัดซื้อ/จัดหาเวชภัณฑ์ มูลค่ารวม</button>
        <button class="tab-md tab-item" onclick="selectTab('5.2.2', this)">5.2.2 การตรวจรับเวชภัณฑ์</button>
        <button class="tab-md tab-item" onclick="selectTab('5.2.3', this)">5.2.3 การเบิกจ่ายเวชภัณฑ์ในโรงพยาบาล</button>
        <button class="tab-md tab-item" onclick="selectTab('5.2.4', this)">5.2.4 มูลค่ายาคงคลัง</button>
        <button class="tab-md tab-item" onclick="selectTab('5.2.6', this)">5.2.6 งานสนับสนุนสถานบริการระดับรอง (รพ.สต)</button>
      </div>

      <!-- 4. งานเภสัชกรรมการผลิต -->
      <div class="tab-group group-prod">
        <button class="tab-xl tab-item" onclick="selectTab('prod_246', this)">งานเภสัชกรรมการผลิต</button>
      </div>

      <!-- 5. งานเภสัชกรรมปฐมภูมิ -->
      <div class="tab-group group-pcu">
        <div class="tab-xl">งานเภสัชกรรมปฐมภูมิ</div>
        <button class="tab-lg tab-item" onclick="selectTab('7.1', this)">7.1 Visit</button>
        <button class="tab-lg tab-item" onclick="selectTab('7.6', this)">7.6 กิจกรรมเยี่ยมผู้ป่วย</button>
        <button class="tab-lg tab-item" onclick="selectTab('7.7', this)">7.7 งานกัญชาทางการแพทย์</button>
        <button class="tab-md tab-item" onclick="selectTab('7.9', this)">7.9 RDU PCU</button>
      </div>

      <!-- 6. ข้อมูลระบบงานคุณภาพ -->
      <div class="tab-group group-qa">
        <div class="tab-xl">ข้อมูลระบบงานคุณภาพ</div>
        <button class="tab-lg tab-item" onclick="selectTab('9.1', this)">9.1 RDU</button>
        <button class="tab-lg tab-item" onclick="selectTab('9.9', this)">9.9 Medication recondiliation</button>
        <button class="tab-lg tab-item" onclick="selectTab('9.10', this)">9.10 ความพึงพอใจของผู้มารับการ</button>
      </div>

    </aside>

    <!-- พื้นที่แสดงผลด้านขวา -->
    <main class="content-area" id="contentArea">
      <!-- เนื้อหาจะถูกสร้างด้วย JavaScript -->
    </main>
  </div>

  <script>
    const MONTHS = ['ต.ค.', 'พ.ย.', 'ธ.ค.', 'ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.'];
    let activeCharts = [];

    // ข้อมูลเริ่มต้น (และจะถูกแทนที่อัตโนมัติเมื่อผู้ใช้อัปโหลดไฟล์ CSV จากแผ่นงาน)
    const dashboardData = {
      '1.1': {
        group: 'งานบริการเภสัชกรรมผู้ป่วยนอก',
        title: '1.1 ข้อมูลบริการทั่วไป',
        color: '#2563eb',
        type: 'trend_and_total',
        items: [
          { name: 'จำนวนผู้มารับบริการผู้ป่วยนอก (ราย)', total: 248500, trend: [20100, 20450, 21200, 20800, 19950, 21100, 19800, 20900, 21300, 20700, 21050, 21150] },
          { name: 'จำนวนใบสั่งยาผู้ป่วยนอก (ใบ)', total: 286400, trend: [23200, 23800, 24100, 23900, 22950, 24300, 23100, 24000, 24500, 23950, 24200, 24400] },
          { name: 'จำนวนรายการยาที่จ่าย (รายการ)', total: 1142000, trend: [94000, 95200, 96500, 95800, 92100, 96800, 93400, 95900, 96200, 95100, 95400, 95600] },
          { name: 'มูลค่ายาผู้ป่วยนอก (บาท)', total: 145800000, trend: [11900000, 12100000, 12400000, 12200000, 11700000, 12300000, 11800000, 12250000, 12450000, 12150000, 12250000, 12300000] },
          { name: 'ผู้ป่วยรับยาใกล้บ้าน / จัดส่งยา (ราย)', total: 14250, trend: [1120, 1150, 1210, 1180, 1140, 1200, 1160, 1190, 1220, 1210, 1230, 1240] }
        ]
      },
      '1.2.1': {
        group: 'งานบริการเภสัชกรรมผู้ป่วยนอก',
        title: '1.2.1 Medication Error (ผู้ป่วยนอก)',
        color: '#2563eb',
        type: 'total_vs_target',
        items: [
          { name: 'Prescribing Error (ครั้ง)', actual: 412, target: '< 500', pass: true },
          { name: 'Transcribing Error (ครั้ง)', actual: 85, target: '< 120', pass: true },
          { name: 'Pre-dispensing Error (ครั้ง)', actual: 1240, target: '< 1,500', pass: true },
          { name: 'Dispensing Error (ครั้ง)', actual: 28, target: '< 35', pass: true },
          { name: 'Dispensing Error ระดับ E ขึ้นไป (ครั้ง)', actual: 0, target: '0', pass: true },

          { name: 'ความพึงพอใจของผู้มารับบริการต่อการบริการเภสัชกรรมรวมทั้งปี (%)', actual: 91.4, target: '>= 85%', pass: true }
        ]
      }
    };

    function formatNum(num) {
      if (typeof num !== 'number' || isNaN(num)) return num;
      return num.toLocaleString('th-TH', { maximumFractionDigits: 2 });
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
    }

    function clearCharts() {
      activeCharts.forEach(c => c.destroy());
      activeCharts = [];
    }

    function selectTab(key, btnEl) {
      document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      renderSection(key);
    }

    function renderSection(key) {
      clearCharts();
      const data = dashboardData[key];
      const container = document.getElementById('contentArea');
      if (!data) return;

      let html = `
        <div class="section-banner" style="background: ${data.color}">
          <div class="group-label">${data.group}</div>
          <div class="item-title">${data.title}</div>
        </div>
      `;

      // 1. กราฟแนวโน้ม + ยอดรวมทั้งปี
      if (data.type === 'trend_and_total') {
        html += `
          <div class="card">
            <div class="card-title">📊 สรุปยอดรวมทั้งปี</div>
            <div class="kpi-grid">
              ${data.items.map(it => `
                <div class="kpi-item">
                  <div class="kpi-name">${it.name}</div>
                  <div class="kpi-values">
                    <span class="kpi-actual" style="color:${data.color}">${formatNum(it.total)}</span>
                    <span class="kpi-target">รวมทั้งปี</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
          <div class="card">
            <div class="card-title">📈 แนวโน้มรายเดือน (ต.ค. - ก.ย.)</div>
            <div class="chart-box-tall">
              <canvas id="mainChart"></canvas>
            </div>
          </div>
        `;
        container.innerHTML = html;

        const ctx = document.getElementById('mainChart').getContext('2d');
        const palette = ['#2563eb', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
        activeCharts.push(new Chart(ctx, {
          type: 'line',
          data: {
            labels: MONTHS,
            datasets: data.items.map((it, idx) => ({
              label: it.name,
              data: it.trend,
              borderColor: palette[idx % palette.length],
              backgroundColor: palette[idx % palette.length] + '22',
              borderWidth: 2,
              tension: 0.3,
              pointRadius: 2.5
            }))
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10, family: 'Prompt' } } }
            },
            scales: {
              x: { ticks: { font: { size: 9.5, family: 'Prompt' } } },
              y: { ticks: { font: { size: 9.5, family: 'Prompt' } } }
            }
          }
        }));
      }

      // 2. ยอดรวมทั้งปีเปรียบเทียบกับเป้าหมาย
      else if (data.type === 'total_vs_target') {
        html += `
          <div class="card">
            <div class="card-title">🎯 ยอดรวมทั้งปีเปรียบเทียบกับเป้าหมาย</div>
            <div class="kpi-grid">
              ${data.items.map(it => `
                <div class="kpi-item">
                  <div class="kpi-name">${it.name}</div>
                  <div class="kpi-values">
                    <span class="kpi-actual">${formatNum(it.actual)}</span>
                    <span class="kpi-target ${it.pass ? 'badge-pass' : 'badge-fail'}">
                      เป้าหมาย: ${it.target} (${it.pass ? 'ผ่าน' : 'ไม่ผ่าน'})
                    </span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
          <div class="card">
            <div class="card-title">📊 กราฟเปรียบเทียบผลงานทั้งปี</div>
            <div class="chart-box">
              <canvas id="barChart"></canvas>
            </div>
          </div>
        `;
        container.innerHTML = html;

        const ctx = document.getElementById('barChart').getContext('2d');
        activeCharts.push(new Chart(ctx, {
          type: 'bar',
          data: {
            labels: data.items.map(i => i.name.length > 18 ? i.name.slice(0, 18) + '...' : i.name),
            datasets: [{
              label: 'ผลงานรวมทั้งปี',
              data: data.items.map(i => i.actual),
              backgroundColor: data.items.map(i => i.pass ? data.color : '#e11d48'),
              borderRadius: 5
            }]
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { font: { size: 9.5, family: 'Prompt' } } },
              y: { ticks: { font: { size: 9.5, family: 'Prompt' } } }
            }
          }
        }));
      }

      // 3. กราฟแนวโน้มเปรียบเทียบกับเป้าหมาย
      else if (data.type === 'trend_vs_target') {
        html += `
          <div class="card">
            <div class="card-title">
              <span>📈 แนวโน้มรายเดือนเทียบเป้าหมาย</span>
              <span class="kpi-target badge-pass">${data.targetLabel}</span>
            </div>
            <div class="chart-box-tall">
              <canvas id="trendTargetChart"></canvas>
            </div>
          </div>
          <div class="card">
            <div class="card-title">📋 ค่าเฉลี่ยล่าสุด (ก.ย.) เทียบเป้าหมาย</div>
            <div class="kpi-grid">
              ${data.items.map(it => {
                const latest = it.trend[it.trend.length - 1];
                return `
                  <div class="kpi-item">
                    <div class="kpi-name">${it.name}</div>
                    <div class="kpi-values">
                      <span class="kpi-actual" style="color:${data.color}">${formatNum(latest)}</span>
                      <span class="kpi-target">${data.targetLabel}</span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
        container.innerHTML = html;

        const ctx = document.getElementById('trendTargetChart').getContext('2d');
        const palette = ['#2563eb', '#059669', '#f59e0b', '#8b5cf6'];
        const datasets = data.items.map((it, idx) => ({
          label: it.name,
          data: it.trend,
          borderColor: palette[idx % palette.length],
          borderWidth: 2,
          tension: 0.3,
          pointRadius: 2.5
        }));

        datasets.push({
          label: data.targetLabel,
          data: Array(12).fill(data.targetValue),
          borderColor: '#e11d48',
          borderDash: [5, 5],
          borderWidth: 2,
          pointRadius: 0
        });

        activeCharts.push(new Chart(ctx, {
          type: 'line',
          data: { labels: MONTHS, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10, family: 'Prompt' } } }
            },
            scales: {
              x: { ticks: { font: { size: 9.5 } } },
              y: { ticks: { font: { size: 9.5 } } }
            }
          }
        }));
      }

      // 4. แสดงผลรวมทั้งปีแยกแต่ละรายการ
      else if (data.type === 'annual_breakdown') {
        const maxVal = Math.max(...data.items.map(i => i.total), 1);
        html += `
          <div class="card">
            <div class="card-title">📊 ผลรวมทั้งปีแยกตามกิจกรรม</div>
            <div>
              ${data.items.map(it => {
                const pct = Math.min(100, Math.round((it.total / maxVal) * 100));
                return `
                  <div class="progress-row">
                    <div class="progress-header">
                      <span style="font-weight:500;color:#1e293b">${it.name}</span>
                      <span style="font-weight:700;color:${data.color};white-space:nowrap">${formatNum(it.total)}${it.unit || ''}</span>
                    </div>
                    <div class="progress-bar-bg">
                      <div class="progress-bar-fill" style="width:${pct}\%;background:${data.color}"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
        container.innerHTML = html;
      }

      // 5. Pie Chart เดี่ยว (5.1, 5.2.1, 5.2.4)
      else if (data.type === 'pie_single') {
        const sum = data.items.reduce((a, b) => a + b.value, 0);
        html += `
          <div class="card">
            <div class="card-title">🥧 สัดส่วนข้อมูล (Pie Graph)</div>
            <div class="chart-box">
              <canvas id="pieSingle"></canvas>
            </div>
          </div>
          <div class="card">
            <div class="card-title">📋 รายละเอียด (รวม ${formatNum(sum)} ${data.unit})</div>
            <div class="kpi-grid">
              ${data.items.map(it => {
                const pct = sum > 0 ? ((it.value / sum) * 100).toFixed(1) : 0;
                return `
                  <div class="kpi-item">
                    <div class="kpi-name">${it.name}</div>
                    <div class="kpi-values">
                      <span class="kpi-actual" style="color:${data.color}">${formatNum(it.value)}${data.unit}</span>
                      <span class="kpi-target">${pct}%</span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
        container.innerHTML = html;

        const ctx = document.getElementById('pieSingle').getContext('2d');
        activeCharts.push(new Chart(ctx, {
          type: 'pie',
          data: {
            labels: data.items.map(i => i.name),
            datasets: [{
              data: data.items.map(i => i.value),
              backgroundColor: ['#f59e0b', '#2563eb', '#10b981', '#8b5cf6', '#ec4899', '#06b6d4']
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10, family: 'Prompt' } } }
            }
          }
        }));
      }

      // 6. Pie Chart คู่ (5.2.6 แยกจำนวน 1 กราฟ และ มูลค่า 1 กราฟ)
      else if (data.type === 'pie_dual') {
        html += `
          <div class="card">
            <div class="card-title">🥧 กราฟที่ 1: สัดส่วนตามจำนวนรวมทั้งปี</div>
            <div class="chart-box">
              <canvas id="pieQty"></canvas>
            </div>
          </div>
          <div class="card">
            <div class="card-title">🥧 กราฟที่ 2: สัดส่วนตามมูลค่ารวมทั้งปี (บาท)</div>
            <div class="chart-box">
              <canvas id="pieVal"></canvas>
            </div>
          </div>
        `;
        container.innerHTML = html;

        const ctx1 = document.getElementById('pieQty').getContext('2d');
        activeCharts.push(new Chart(ctx1, {
          type: 'pie',
          data: {
            labels: data.qtyItems.map(i => i.name),
            datasets: [{
              data: data.qtyItems.map(i => i.value),
              backgroundColor: ['#0891b2', '#f59e0b', '#10b981', '#6366f1']
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10, family: 'Prompt' } } } }
          }
        }));

        const ctx2 = document.getElementById('pieVal').getContext('2d');
        activeCharts.push(new Chart(ctx2, {
          type: 'pie',
          data: {
            labels: data.valItems.map(i => i.name),
            datasets: [{
              data: data.valItems.map(i => i.value),
              backgroundColor: ['#d97706', '#2563eb', '#ec4899', '#10b981']
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10, family: 'Prompt' } } } }
          }
        }));
      }

      // 7. 7.9 RDU PCU (หักลบแสดงจำนวน รพ.สต. ที่ไม่ผ่านจาก 19 แห่ง)
      else if (data.type === 'rdu_pcu_19') {
        html += `
          <div class="card">
            <div class="card-title">🏥 ผลประเมิน RDU PCU เมื่อสิ้น ก.ย. (ทั้งหมด ${data.totalPcu} แห่ง)</div>
            <div class="kpi-grid">
              ${data.items.map(it => {
                const failed = Math.max(0, data.totalPcu - it.passedCount);
                return `
                  <div class="kpi-item">
                    <div class="kpi-name">${it.name}</div>
                    <div class="kpi-values" style="margin-top:6px">
                      <span class="kpi-target badge-pass">ผ่านเกณฑ์: ${it.passedCount} แห่ง</span>
                      <span class="kpi-target badge-fail">ไม่ผ่าน (19 - ${it.passedCount}):${failed} แห่ง</span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
          <div class="card">
            <div class="card-title">📊 เปรียบเทียบจำนวน รพ.สต. ที่ผ่าน vs ไม่ผ่าน</div>
            <div class="chart-box">
              <canvas id="pcuChart"></canvas>
            </div>
          </div>
        `;
        container.innerHTML = html;

        const ctx = document.getElementById('pcuChart').getContext('2d');
        activeCharts.push(new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['URI (<=20%)', 'Acute Diarrhea (<=20%)'],
            datasets: [
              {
                label: 'ผ่านเกณฑ์ (แห่ง)',
                data: data.items.map(i => i.passedCount),
                backgroundColor: '#10b981'
              },
              {
                label: 'ไม่ผ่านเกณฑ์ (แห่ง)',
                data: data.items.map(i => Math.max(0, data.totalPcu - i.passedCount)),
                backgroundColor: '#e11d48'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { font: { size: 10, family: 'Prompt' } } } },
            scales: {
              x: { stacked: true, ticks: { font: { size: 10, family: 'Prompt' } } },
              y: { stacked: true, max: 19, ticks: { font: { size: 10, family: 'Prompt' } } }
            }
          }
        }));
      }

      // 8. 9.1 RDU (แสดงผลเมื่อสิ้น ก.ย. และแสดงรายการที่ไม่ผ่านเนื่องจากมากกว่าเป้าหมาย 3 รายการ)
      else if (data.type === 'rdu_9_1') {
        const failedMoreThanTarget = data.items.filter(it => it.op === '<=' && it.actual > it.target).slice(0, 3);

        html += `
          <div class="alert-box">
            <div class="alert-title">⚠️ รายการกิจกรรมที่ไม่ผ่านเกณฑ์ (เนื่องจากมากกว่าเป้าหมาย ${failedMoreThanTarget.length} รายการ)</div>
            <ul class="alert-list">
              ${failedMoreThanTarget.map(it => `
                <li>• <strong>${it.name}</strong>: ผลงานสิ้น ก.ย. = <strong>${it.actual}${it.unit}</strong> (เป้าหมายไม่เกิน ${it.target}${it.unit})</li>
              `).join('')}
            </ul>
          </div>

          <div class="card">
            <div class="card-title">📋 ผลตัวชี้วัด RDU แยกกิจกรรม (เมื่อสิ้น ก.ย.)</div>
            <div class="kpi-grid">
              ${data.items.map(it => {
                const isFail = (it.op === '<=' && it.actual > it.target) || (it.op === '>=' && it.actual < it.target);
                return `
                  <div class="kpi-item" style="${isFail ? 'border-color:#fda4af;background:#fff1f2' : ''}">
                    <div class="kpi-name">${it.name}</div>
                    <div class="kpi-values">
                      <span class="kpi-actual" style="color:${isFail ? '#e11d48' : '#059669'}">${it.actual}${it.unit}</span>
                      <span class="kpi-target ${isFail ? 'badge-fail' : 'badge-pass'}">
                        เป้าหมาย ${it.op}${it.target}${it.unit} (${isFail ? 'ไม่ผ่าน' : 'ผ่าน'})
                      </span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
        container.innerHTML = html;
      }

      // 9. 9.9 Medication Reconciliation เมื่อสิ้น ก.ย.
      else if (data.type === 'single_sep') {
        html += `
          <div class="card" style="text-align:center;padding:18px 12px;">
            <div class="card-title" style="justify-content:center">${data.name}</div>
            <div style="font-size:34px;font-weight:700;color:${data.color};margin:10px 0;">
              ${formatNum(data.actual)}${data.unit}
            </div>
            <span class="kpi-target badge-pass">เป้าหมาย: ${data.target} (ข้อมูลเมื่อสิ้น ก.ย.)</span>
          </div>
        `;
        container.innerHTML = html;
      }
    }

    // ฟังก์ชันอ่านไฟล์ CSV ที่ส่งออกจาก Google Sheets ตามลำดับแถวที่กำหนด (โดยไม่แสดงเลขแถวบน UI)
    document.getElementById('csvFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      Papa.parse(file, {
        complete: function(results) {
          const rows = results.data;
          if (!rows || rows.length < 50) {
            alert('ไฟล์ CSV มีจำนวนแถวน้อยกว่าที่กำหนด กรุณาตรวจสอบแผ่นงาน');
            return;
          }

          const toNum = (val) => {
            if (!val) return 0;
            const cleaned = String(val).replace(/,/g, '').replace(/%/g, '').trim();
            const n = parseFloat(cleaned);
            return isNaN(n) ? 0 : n;
          };

          // ดึงข้อมูลจากช่วงแถว (1-based row index)
          const extractRows = (startRow, endRow) => {
            const list = [];
            for (let r = startRow - 1; r <= endRow - 1 && r < rows.length; r++) {
              const row = rows[r];
              if (!row) continue;
              const name = (row[1] || row[0] || row[2] || '').trim();
              if (!name) continue;
              const nums = row.slice(2).map(toNum);
              const monthly = nums.slice(0, 12);
              const sumMonthly = monthly.reduce((a, b) => a + b, 0);
              const lastNonZero = [...nums].reverse().find(v => v !== 0) || sumMonthly;
              list.push({
                name,
                target: row[2] || '-',
                trend: monthly,
                total: lastNonZero || sumMonthly,
                actual: lastNonZero || sumMonthly,
                value: lastNonZero || sumMonthly,
                sepValue: monthly[11] || lastNonZero
              });
            }
            return list;
          };

          // อัปเดตแต่ละหมวดตามแถวที่กำหนด
          const r1_1 = extractRows(9, 13);
          if (r1_1.length) dashboardData['1.1'].items = r1_1;

          const r1_2_1 = extractRows(17, 24);
          if (r1_2_1.length) dashboardData['1.2.1'].items = r1_2_1.map(i => ({ ...i, pass: true }));

          const r1_2_6 = extractRows(45, 54);
          if (r1_2_6.length) dashboardData['1.2.6'].items = r1_2_6;

          const r2_2 = extractRows(65, 96);
          if (r2_2.length) dashboardData['2.2'].items = r2_2;

          const r3_1 = extractRows(99, 102);
          if (r3_1.length) dashboardData['3.1'].items = r3_1;

          const r3_2_1 = extractRows(106, 110);
          if (r3_2_1.length) dashboardData['3.2.1'].items = r3_2_1.map(i => ({ ...i, pass: true }));

          const r3_2_4 = extractRows(124, 126);
          if (r3_2_4.length) dashboardData['3.2.4'].items = r3_2_4.map(i => ({ ...i, pass: true }));

          const r3_2_7_1 = extractRows(135, 136);
          if (r3_2_7_1.length) dashboardData['3.2.7.1'].items = r3_2_7_1;

          const r5_1 = extractRows(152, 154);
          if (r5_1.length) dashboardData['5.1'].items = r5_1;

          const r5_2_1 = extractRows(157, 172);
          if (r5_2_1.length) dashboardData['5.2.1'].items = r5_2_1;

          const r5_2_2 = extractRows(184, 187);
          if (r5_2_2.length) dashboardData['5.2.2'].items = r5_2_2;

          const r5_2_3 = extractRows(189, 192);
          if (r5_2_3.length) dashboardData['5.2.3'].items = r5_2_3;

          const r5_2_4 = extractRows(195, 198);
          if (r5_2_4.length) dashboardData['5.2.4'].items = r5_2_4.map(i => ({ name: i.name, value: i.sepValue }));

          const rProd = extractRows(246, 253);
          if (rProd.length) dashboardData['prod_246'].items = rProd;

          const r7_1 = extractRows(263, 265);
          if (r7_1.length) dashboardData['7.1'].items = r7_1;

          const r7_6 = extractRows(293, 294);
          if (r7_6.length) dashboardData['7.6'].items = r7_6;

          const r7_7 = extractRows(296, 297);
          if (r7_7.length) dashboardData['7.7'].items = r7_7;

          const r7_9 = extractRows(302, 303);
          if (r7_9.length) {
            dashboardData['7.9'].items = r7_9.map(i => ({ name: i.name, passedCount: i.sepValue }));
          }

          renderSection('1.1');
          alert('อัปเดตข้อมูลจากไฟล์ CSV สำเร็จเรียบร้อยแล้ว');
        }
      });
    });

    // แสดงหน้าแรกเมื่อโหลดเสร็จ
    window.addEventListener('DOMContentLoaded', () => {
      renderSection('1.1');
    });
  </script>
</body>
</html>
